<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euclid</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <div class="brand">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7" />
            <line x1="6.5" y1="16.5" x2="17.5" y2="7.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <circle cx="12" cy="12" r="1.8" fill="currentColor" />
          </svg>
          <span>Euclid</span>
        </div>
      </div>
      <div class="sidebar-label">Chats</div>
      <nav id="chat-list" class="chat-list" aria-label="Saved chats"></nav>
    </aside>

    <div id="backdrop" class="backdrop" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            id="toggle-sidebar"
            class="icon-btn"
            aria-label="Toggle conversations"
            title="Toggle sidebar"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>

          <div class="model-picker">
            <label for="model-select" class="sr-only">Model</label>
            <select id="model-select" aria-label="Model"></select>
            <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M4.5 6.5 8 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <div class="topbar-right">
          <div id="context-hud" class="context-hud" tabindex="0" aria-label="Context window usage">
            <span class="ctx-bar" aria-hidden="true"><span id="ctx-bar-fill" class="ctx-bar-fill"></span></span>
            <span id="ctx-usage" class="ctx-usage">0 / 1M (0%)</span>
            <span id="intel-loss" class="intel-loss">−0% intelligence</span>
            <div id="ctx-tooltip" class="ctx-tooltip" role="tooltip"></div>
          </div>

          <button type="button" id="new-chat" class="new-chat-btn">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M8 3.25v9.5M3.25 8h9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <span>New chat</span>
          </button>
        </div>
      </header>

      <main id="transcript" class="transcript" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <svg class="empty-mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" />
            <line x1="6.5" y1="16.5" x2="17.5" y2="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="12" cy="12" r="1.7" fill="currentColor" />
          </svg>
          <h1>Euclid</h1>
          <p class="empty-sub">Minimal multi-model chat workspace.</p>
          <div id="starter-prompts" class="starters"></div>
          <div id="key-notice" class="key-notice" hidden>
            No provider API keys are configured on this server. Add
            <code>GEMINI_API_KEY</code>, <code>ANTHROPIC_API_KEY</code>, or
            <code>BASETEN_API_KEY</code> to <code>euclid/.env</code> and restart.
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </main>

      <footer class="composer-wrap">
        <form id="composer" class="composer">
          <textarea
            id="prompt"
            rows="1"
            placeholder="Message Euclid…"
            aria-label="Message"
          ></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
            <svg class="icon-send" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M8 12.5V3.5M4.25 7.25 8 3.5l3.75 3.75" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg class="icon-stop" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor" />
            </svg>
          </button>
        </form>
        <div class="composer-foot">
          <span id="status" role="status"></span>
          <span class="shortcut">Enter to send · Shift+Enter for new line</span>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
