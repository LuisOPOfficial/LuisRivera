<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euclid's Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="app">
    <header>
      <h1>Euclid's Harness</h1>
      <p class="lede">Build a tower of ideas. Pull a block and see if it still stands.</p>
    </header>

    <form id="composer">
      <label for="claim">Claim</label>
      <textarea id="claim" rows="2" placeholder="The sun will rise tomorrow."></textarea>
      <div class="actions">
        <button type="submit" id="decompose" class="primary">Build the tower</button>
        <button type="button" id="stress-all" class="ghost" disabled>Stress test all</button>
        <button type="button" id="add" class="ghost">Add a block</button>
        <span id="status" role="status"></span>
      </div>
    </form>

    <section id="verdict" class="verdict" hidden></section>
    <div id="playground" class="playground">
      <div id="tower" class="tower" aria-label="Idea tower"></div>
      <div id="tray" class="tray" hidden>
        <h2>Pulled out</h2>
        <div id="tray-blocks" class="tray-blocks"></div>
      </div>
    </div>
    <section id="summary" class="summary" hidden></section>

    <footer>
      <div class="keyline">
        <label for="key">Gemini key</label>
        <input id="key" type="password" name="euclid-gemini-key" autocomplete="off" spellcheck="false" placeholder="Paste a key if the server has none" />
        <button type="button" id="forget" class="quiet" hidden>Forget</button>
      </div>
      <p id="foot"></p>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
